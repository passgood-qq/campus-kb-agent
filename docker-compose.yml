# 部署 / CI 用：PostgreSQL + pgvector
# 本地日常开发走原生 PostgreSQL（见 README 方式 A），这个文件主要给部署和以后接 CI 用。
#
# 用法：
#   docker compose up -d
#   docker compose exec db psql -U postgres -d campus_kb -c "\dt"
#
# 注意：db/schema.sql 只在「数据卷第一次创建」时自动执行；
#       改了 schema 要重跑：docker compose down -v && docker compose up -d

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: campus-kb-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-campus_kb}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-campus_kb}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
